services:
  - type: web
    name: patient-translator-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install uv && uv sync"
    startCommand: "uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: GOOGLE_API_KEY
        sync: false
