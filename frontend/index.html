<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <title>frontend</title>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-50 font-sans h-screen w-full overflow-hidden transition-colors duration-300">
    <div id="app" class="h-full w-full">
      <!-- Skeleton Loader -->
      <div class="animate-pulse w-full max-w-4xl mx-auto mt-24 flex flex-col items-center">
        <div class="h-12 w-64 bg-slate-200 dark:bg-slate-800 rounded-lg mb-6"></div>
        <div class="h-6 w-96 bg-slate-100 dark:bg-slate-800/50 rounded mb-12"></div>
        <div class="w-full h-80 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm mb-8 p-12 flex flex-col items-center">
          <div class="h-16 w-16 bg-slate-200 dark:bg-slate-800 rounded-full mb-6"></div>
          <div class="h-6 w-48 bg-slate-200 dark:bg-slate-800 rounded mb-3"></div>
          <div class="h-4 w-72 bg-slate-100 dark:bg-slate-800/50 rounded mb-8"></div>
          <div class="h-10 w-32 bg-teal-100 dark:bg-teal-900/40 rounded-lg"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
